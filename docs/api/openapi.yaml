openapi: 3.1.0
info:
  title: DataMboa LMS API
  version: 1.0.0
  description: Official REST API specification for DataMboa e-learning platform.
servers:
  - url: http://localhost:8000/api/v1
    description: Local development server
paths:
  /auth/register/:
    post:
      summary: Register a new learner
      description: Creates a user account with the LEARNER role, establishes an authenticated session, and creates the associated LearnerProfile.
      operationId: registerLearner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterLearnerRequest'
      responses:
        '201':
          description: Learner registered and session created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Validation error (duplicate email, weak password, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login/:
    post:
      summary: Log in with credentials
      description: Authenticates user credentials via email and password, establishing an HTTP-only secure session cookie.
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/google/:
    post:
      summary: Authenticate with Google
      description: Verifies Google OAuth ID token and logs in or creates learner account.
      operationId: googleAuth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - credential
              properties:
                credential:
                  type: string
                  description: Google ID token credential
      responses:
        '200':
          description: Authenticated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid or expired Google token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout/:
    post:
      summary: Log out
      description: Clears the current user session cookie.
      operationId: logoutUser
      responses:
        '200':
          description: Successfully logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Successfully logged out.
        '401':
          description: Authentication credentials were not provided.

  /auth/me/:
    get:
      summary: Get current authenticated user
      description: Returns the user profile of the currently logged-in account.
      operationId: getCurrentUser
      responses:
        '200':
          description: Authenticated user profile data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '403':
          description: Authentication credentials were not provided.
    patch:
      summary: Update current learner profile
      description: Updates editable personal details and learner profile goals.
      operationId: updateCurrentUserProfile
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '403':
          description: Authentication credentials were not provided.

  /auth/change-password/:
    post:
      summary: Change password
      description: Allows an authenticated user to change their account password.
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - current_password
                - new_password
              properties:
                current_password:
                  type: string
                  format: password
                  example: OldSecurePass123
                new_password:
                  type: string
                  format: password
                  minLength: 8
                  example: NewSecurePass456
      responses:
        '200':
          description: Password updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Password changed successfully.
        '400':
          description: Current password is incorrect or new password does not meet requirements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authentication credentials were not provided.

  /courses/:
    get:
      summary: List published courses
      description: Returns a list of published courses with optional filters (tool, level, price_tier).
      operationId: listCourses
      parameters:
        - name: tool
          in: query
          schema:
            type: string
            enum: [EXCEL, POWERBI, SQL, PYTHON, GITHUB]
        - name: level
          in: query
          schema:
            type: string
            enum: [BEGINNER, INTERMEDIATE, ADVANCED]
      responses:
        '200':
          description: List of courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CourseSummary'

  /courses/{slug}/:
    get:
      summary: Get course detail and syllabus
      description: Returns detailed course metadata and its full curriculum (modules and lessons).
      operationId: getCourseDetail
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            example: excel-bases-analyse
        - name: lang
          in: query
          schema:
            type: string
            enum: [fr, en]
      responses:
        '200':
          description: Course details and modules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDetail'
        '404':
          description: Course not found

  /courses/{course_slug}/lessons/{lesson_slug}/:
    get:
      summary: Get lesson detail and content
      description: Returns full localized lesson content, rich markdown, media URLs, and sequential navigation.
      operationId: getLessonDetail
      parameters:
        - name: course_slug
          in: path
          required: true
          schema:
            type: string
            example: excel-bases-analyse
        - name: lesson_slug
          in: path
          required: true
          schema:
            type: string
            example: nettoyer-donnees-ventes-douala
        - name: lang
          in: query
          schema:
            type: string
            enum: [fr, en]
      responses:
        '200':
          description: Detailed lesson content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonDetail'
        '404':
          description: Lesson not found

  /courses/attachments/{id}/download/:
    get:
      summary: Download a lesson attachment / exercise file (F1.6)
      description: Safely streams or redirects to the requested file, increments download analytics, and validates access rights.
      operationId: downloadLessonAttachment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Binary file stream with Content-Disposition
        '302':
          description: Redirect to external storage URL
        '403':
          description: Access denied (requires active subscription)
        '404':
          description: Attachment not found

components:
  schemas:
    LessonAttachment:
      type: object
      required:
        - id
        - title
        - attachment_type
        - file_format
        - file_size_bytes
        - file_size_display
        - download_url
        - is_free_preview
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: "Tableau d'exercice — Découverte des types (Douala)"
        description:
          type: string
        attachment_type:
          type: string
          enum: [STARTER, SOLUTION, DATASET, CHEATSHEET, OTHER]
          example: STARTER
        file_format:
          type: string
          example: xlsx
        file_size_bytes:
          type: integer
          example: 128500
        file_size_display:
          type: string
          example: 125.5 Ko
        download_url:
          type: string
        is_free_preview:
          type: boolean
          example: true
        download_count:
          type: integer
          example: 42
        order:
          type: integer
          example: 1

    LessonTranslation:
      type: object
      properties:
        language:
          type: string
          example: fr
        title:
          type: string
        summary:
          type: string
        content:
          type: string
        video_url:
          type: string
        audio_url:
          type: string
        pdf_url:
          type: string
        code_snippet:
          type: string
        status:
          type: string

    LessonDetail:
      type: object
      properties:
        id:
          type: integer
        course_slug:
          type: string
        course_title:
          type: string
        module_id:
          type: integer
        module_title:
          type: string
        title:
          type: string
        slug:
          type: string
        lesson_type:
          type: string
        duration_minutes:
          type: integer
        is_free_preview:
          type: boolean
        translation:
          $ref: '#/components/schemas/LessonTranslation'
        is_fallback_language:
          type: boolean
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/LessonAttachment'
        previous_lesson:
          type: object
          nullable: true
        next_lesson:
          type: object
          nullable: true

    RegisterLearnerRequest:
      type: object
      required:
        - email
        - password
        - first_name
        - last_name
      properties:
        email:
          type: string
          format: email
          example: laure@exemple.cm
        password:
          type: string
          format: password
          minLength: 8
          example: SecurePass123
        first_name:
          type: string
          example: Laure
        last_name:
          type: string
          example: Kamga
        phone_number:
          type: string
          example: "+237657546259"
        study_level:
          type: string
          example: Licence 3
        learning_goal:
          type: string
          example: Reconversion Data Analyst
        whatsapp_consent:
          type: boolean
          default: false

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: laure@exemple.cm
        password:
          type: string
          format: password
          example: SecurePass123

    UpdateProfileRequest:
      type: object
      properties:
        first_name:
          type: string
        last_name:
          type: string
        phone_number:
          type: string
        study_level:
          type: string
        learning_goal:
          type: string
        whatsapp_consent:
          type: boolean

    LearnerProfileResponse:
      type: object
      properties:
        study_level:
          type: string
        learning_goal:
          type: string
        whatsapp_consent:
          type: boolean
        created_at:
          type: string
          format: date-time

    UserResponse:
      type: object
      required:
        - id
        - email
        - first_name
        - last_name
        - full_name
        - role
        - is_learner
        - is_instructor
        - is_admin_role
        - created_at
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: laure@exemple.cm
        first_name:
          type: string
          example: Laure
        last_name:
          type: string
          example: Kamga
        full_name:
          type: string
          example: Laure Kamga
        phone_number:
          type: string
          example: "+237657546259"
        role:
          type: string
          enum: [LEARNER, INSTRUCTOR, ADMIN]
          example: LEARNER
        is_learner:
          type: boolean
        is_instructor:
          type: boolean
        is_admin_role:
          type: boolean
        learner_profile:
          $ref: '#/components/schemas/LearnerProfileResponse'
        created_at:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
